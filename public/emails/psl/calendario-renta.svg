<svg width="1260" height="520" viewBox="0 0 1260 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="calBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <radialGradient id="calGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
    <filter id="calShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1260" height="520" fill="url(#calBg)" />
  <rect width="1260" height="520" fill="url(#calGlow)" />

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <rect width="210" height="36" rx="18" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#a5b4fc" />
    <text x="36" y="23" font-family="'Open Sans', sans-serif" font-size="14" font-weight="700" fill="#c7d2fe" letter-spacing="1">IMPUESTOS 2018</text>

    <text x="0" y="95" font-family="'Open Sans', sans-serif" font-size="44" font-weight="900" fill="#ffffff">DECLARACIÓN DE</text>
    <text x="0" y="145" font-family="'Open Sans', sans-serif" font-size="44" font-weight="900" fill="#a5b4fc">RENTA PERSONAS</text>

    <text x="0" y="200" font-family="'Open Sans', sans-serif" font-size="20" font-weight="500" fill="#e0e7ff">Vencimientos entre Agosto y Octubre de 2018</text>
    <text x="0" y="232" font-family="'Open Sans', sans-serif" font-size="18" font-weight="400" fill="#c7d2fe">Consulta las fechas límite según los dos últimos dígitos de tu NIT</text>
  </g>

  <!-- Right Visual: Calendar Grid Card -->
  <g transform="translate(790, 75)" filter="url(#calShadow)">
    <rect width="380" height="370" rx="16" fill="#ffffff" />
    <rect width="380" height="70" rx="16" fill="#4338ca" />
    <rect y="54" width="380" height="16" fill="#4338ca" />

    <text x="30" y="44" font-family="'Open Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff">AGUSTO - OCTUBRE 2018</text>
    <text x="350" y="44" font-family="'Open Sans', sans-serif" font-size="13" font-weight="700" fill="#c7d2fe" text-anchor="end">DIAN</text>

    <!-- Weekdays -->
    <g transform="translate(30, 95)" font-family="'Open Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">
      <text x="20">L</text>
      <text x="70">M</text>
      <text x="120">M</text>
      <text x="170">J</text>
      <text x="220">V</text>
      <text x="270">S</text>
      <text x="315">D</text>
    </g>

    <!-- Calendar days & highlight badges -->
    <g transform="translate(30, 130)" font-family="'Open Sans', sans-serif" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">
      <text x="20" fill="#94a3b8">30</text>
      <text x="70" fill="#94a3b8">31</text>
      <text x="120">01</text>
      <text x="170">02</text>
      <text x="220">03</text>
      <text x="270">04</text>
      <text x="315">05</text>

      <text x="20" y="40">06</text>
      <text x="70" y="40">07</text>
      <text x="120" y="40">08</text>
      <!-- Highlighted Day 09 (NIT 99-00) -->
      <circle cx="170" cy="35" r="16" fill="#ef4444" />
      <text x="170" y="40" fill="#ffffff" font-weight="800">09</text>
      <text x="220" y="40">10</text>
      <text x="270" y="40">11</text>
      <text x="315" y="40">12</text>

      <text x="20" y="80">13</text>
      <!-- Highlighted Day 14 (NIT 95-96) -->
      <circle cx="70" cy="75" r="16" fill="#4338ca" />
      <text x="70" y="80" fill="#ffffff" font-weight="800">14</text>
      <text x="120" y="80">15</text>
      <text x="170" y="80">16</text>
      <text x="220" y="80">17</text>
      <text x="270" y="80">18</text>
      <text x="315" y="80">19</text>
    </g>

    <!-- Bottom summary tag -->
    <rect x="30" y="280" width="320" height="60" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
    <text x="50" y="305" font-family="'Open Sans', sans-serif" font-size="12" font-weight="800" fill="#4338ca">¡PREPARA TU INFORMACIÓN A TIEMPO!</text>
    <text x="50" y="325" font-family="'Open Sans', sans-serif" font-size="11" font-weight="500" fill="#6b21a8">Genera tus certificados contables desde PSL ERP en 1 clic</text>
  </g>
</svg>