<svg width="700" height="140" viewBox="0 0 700 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cubeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cubeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cubeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- 3D Isometric Cube Icon -->
  <g transform="translate(130, 25)">
    <!-- Top Face -->
    <path d="M 45 5 L 85 28 L 45 50 L 5 28 Z" fill="url(#cubeGrad3)" />
    <!-- Left Face -->
    <path d="M 5 28 L 45 50 L 45 92 L 5 70 Z" fill="url(#cubeGrad1)" />
    <!-- Right Face -->
    <path d="M 45 50 L 85 28 L 85 70 L 45 92 Z" fill="url(#cubeGrad2)" />
    <!-- Inner Core Dot -->
    <circle cx="45" cy="48" r="5" fill="#ffffff" />
  </g>

  <!-- PSL Bold Typography -->
  <text x="240" y="85" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="4">PSL</text>
  
  <!-- ERP Badge & Accent -->
  <rect x="400" y="38" width="130" height="52" rx="8" fill="#0284c7" />
  <text x="465" y="76" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="5" text-anchor="middle">ERP</text>
  
  <!-- Tagline underneath -->
  <text x="242" y="112" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3">SOFTWARE DE GESTIÓN EMPRESARIAL</text>
</svg>