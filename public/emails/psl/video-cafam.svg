<svg width="1260" height="520" viewBox="0 0 1260 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="60%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="playGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0" />
    </radialGradient>
    <filter id="playShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1260" height="520" fill="url(#vidBg)" />
  <rect width="1260" height="520" fill="url(#playGlow)" />

  <!-- Background decorative campus / architecture lines -->
  <path d="M 0 450 L 300 200 L 700 350 L 1260 100" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.2" fill="none" />
  <path d="M 0 500 L 400 300 L 900 420 L 1260 220" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" fill="none" />

  <!-- Video Play Button & Circle in Center -->
  <g transform="translate(630, 210)" filter="url(#playShadow)">
    <circle cx="0" cy="0" r="56" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="0" r="44" fill="#dc2626" />
    <polygon points="-12,-18 20,0 -12,18" fill="#ffffff" />
  </g>

  <!-- Title on top of video -->
  <g transform="translate(630, 90)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />
    <text x="0" y="4" font-family="'Open Sans', sans-serif" font-size="13" font-weight="800" fill="#2dd4bf" letter-spacing="2">CASO DE ÉXITO B2B</text>
    <text x="0" y="65" font-family="'Open Sans', sans-serif" font-size="34" font-weight="900" fill="#ffffff">FUNDACIÓN UNIVERSITARIA CAFAM</text>
  </g>

  <!-- Lower Banner -->
  <g transform="translate(630, 370)" text-anchor="middle">
    <text x="0" y="30" font-family="'Open Sans', sans-serif" font-size="20" font-weight="600" fill="#ccfbf1">"Cómo optimizamos nuestra gestión académica y financiera con PSL ERP"</text>
    <text x="0" y="65" font-family="'Open Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1">▶ VIDEO TESTIMONIAL · 4:25 MIN</text>
  </g>
</svg>