<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2c44" />
      <stop offset="50%" stop-color="#2a3c5a" />
      <stop offset="100%" stop-color="#19253a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e2c44" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="url(#bgGrad)" />
  <rect width="1200" height="500" fill="url(#glow)" />
  <rect width="1200" height="500" fill="url(#grid)" />
  
  <!-- Subtle tech lines & nodes -->
  <path d="M 100 400 L 350 250 L 600 320 L 900 180 L 1100 280" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" fill="none" />
  <circle cx="350" cy="250" r="4" fill="#38bdf8" fill-opacity="0.6" />
  <circle cx="600" cy="320" r="4" fill="#60a5fa" fill-opacity="0.6" />
  <circle cx="900" cy="180" r="5" fill="#38bdf8" fill-opacity="0.8" />
  <circle cx="900" cy="180" r="12" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" fill="none" />
</svg>