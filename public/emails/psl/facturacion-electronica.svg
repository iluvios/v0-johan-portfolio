<svg width="1260" height="520" viewBox="0 0 1260 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="feBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="feGlow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1260" height="520" fill="url(#feBg)" />
  <rect width="1260" height="520" fill="url(#feGlow)" />

  <!-- Diagonal modern stripes -->
  <path d="M 0 520 L 300 0 L 360 0 L 60 520 Z" fill="#ffffff" fill-opacity="0.03" />
  <path d="M 150 520 L 450 0 L 510 0 L 210 520 Z" fill="#ffffff" fill-opacity="0.02" />

  <!-- Left Content -->
  <g transform="translate(80, 100)">
    <!-- Badge -->
    <rect width="190" height="36" rx="18" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#38bdf8" />
    <text x="36" y="23" font-family="'Open Sans', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">NORMATIVA DIAN</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="'Open Sans', sans-serif" font-size="46" font-weight="900" fill="#ffffff">FACTURACIÓN</text>
    <text x="0" y="145" font-family="'Open Sans', sans-serif" font-size="46" font-weight="900" fill="#38bdf8">ELECTRÓNICA</text>

    <!-- Subtitle / Warning -->
    <text x="0" y="200" font-family="'Open Sans', sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">Plazo máximo obligatorio: 1 de Enero de 2019</text>
    <text x="0" y="232" font-family="'Open Sans', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Conoce las sanciones económicas y operativas por incumplimiento</text>
  </g>

  <!-- Right Visual: Clean Modern Invoice Card -->
  <g transform="translate(800, 70)" filter="url(#shadow)">
    <!-- Card Base -->
    <rect width="360" height="380" rx="16" fill="#ffffff" />
    
    <!-- Invoice Header -->
    <rect width="360" height="70" rx="16" fill="#f8fafc" />
    <rect y="54" width="360" height="16" fill="#f8fafc" />
    <circle cx="40" cy="35" r="16" fill="#0284c7" />
    <path d="M 33 35 L 38 40 L 48 30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="70" y="34" font-family="'Open Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a">FACTURA ELECTRÓNICA</text>
    <text x="70" y="50" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b">No. FE-2018-08492 · DIAN Válida</text>

    <!-- Invoice Lines -->
    <rect x="30" y="100" width="140" height="10" rx="5" fill="#cbd5e1" />
    <rect x="250" y="100" width="80" height="10" rx="5" fill="#cbd5e1" />

    <rect x="30" y="130" width="190" height="8" rx="4" fill="#e2e8f0" />
    <rect x="270" y="130" width="60" height="8" rx="4" fill="#e2e8f0" />

    <rect x="30" y="155" width="160" height="8" rx="4" fill="#e2e8f0" />
    <rect x="270" y="155" width="60" height="8" rx="4" fill="#e2e8f0" />

    <rect x="30" y="180" width="180" height="8" rx="4" fill="#e2e8f0" />
    <rect x="270" y="180" width="60" height="8" rx="4" fill="#e2e8f0" />

    <!-- Separator -->
    <line x1="30" y1="210" x2="330" y2="210" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Total -->
    <text x="30" y="245" font-family="'Open Sans', sans-serif" font-size="14" font-weight="700" fill="#64748b">TOTAL CERTIFICADO</text>
    <text x="210" y="245" font-family="'Open Sans', sans-serif" font-size="18" font-weight="900" fill="#0284c7">$ 14.850.000</text>

    <!-- CUFE / Digital Stamp Badge -->
    <rect x="30" y="275" width="300" height="70" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <rect x="45" y="290" width="40" height="40" fill="#0284c7" rx="4" />
    <!-- QR mini representation -->
    <rect x="52" y="297" width="8" height="8" fill="#ffffff" />
    <rect x="68" y="297" width="8" height="8" fill="#ffffff" />
    <rect x="52" y="313" width="8" height="8" fill="#ffffff" />
    <rect x="68" y="313" width="8" height="8" fill="#ffffff" />
    <text x="96" y="306" font-family="'Open Sans', sans-serif" font-size="11" font-weight="700" fill="#0369a1">CÓDIGO CUFE VALIDADO</text>
    <text x="96" y="322" font-family="'Open Sans', sans-serif" font-size="9" font-weight="500" fill="#0284c7">Firma digital autorizada por DIAN</text>
  </g>
</svg>